name: Build

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Version name (default is ref name)'

env:
  # $VERSION is used by release scripts
  VERSION: ${{ github.event.inputs.name || github.ref_name }}

jobs:
  test-vndroid-server:
    runs-on: ubuntu-latest
    env:
      GRADLE: gradle  # use native gradle instead of ./gradlew in scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Test vndroid-server
        run: release/test_server.sh

  build-vndroid-server:
    runs-on: ubuntu-latest
    env:
      GRADLE: gradle  # use native gradle instead of ./gradlew in scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build
        run: release/build_server.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vndroid-server
          path: release/work/build-server/server/vndroid-server

  test-build-vndroid-server-without-gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build without gradle
        run: server/build_without_gradle.sh

  test-client:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew install meson ninja nasm pkg-config sdl3 ffmpeg libusb

      - name: Test
        run: release/test_client.sh

  build-win32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm \
             mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Build
        run: release/build_windows.sh 32

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
            cd release/work/build-win32
            mkdir dist-tar
            cd dist-tar
            tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-win32-intermediate
          path: release/work/build-win32/dist-tar/

  build-win64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm \
             mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Build
        run: release/build_windows.sh 64

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
            cd release/work/build-win64
            mkdir dist-tar
            cd dist-tar
            tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

  build-winarm64:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            base-devel
            unzip
            wget
            autoconf
            automake
            libtool
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-gcc-compat
            mingw-w64-clang-aarch64-meson
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-zlib

      - name: Check architecture
        run: |
            # The MSYS2 tools run under x64 emulation on Windows ARM64, so
            # "uname -m" reports x86_64, but "uname -s" is suffixed with the
            # host machine
            sysname=$(uname -s)
            if [[ "$sysname" != *-ARM64 ]]
            then
                echo "Unexpected architecture: $sysname" >&2
                exit 1
            fi

      - name: Build
        run: release/build_windows.sh arm64

      - name: Check DLL dependencies
        run: |
            cd release/work/build-winarm64/dist
            imports=$(llvm-objdump -p vndroid.exe *.dll | sed -n 's/^ *DLL Name: //p' | sort -u)
            echo "$imports"
            # The binaries must not depend on DLLs provided by the MSYS2
            # toolchain, which are not part of the release
            for dll in "$MINGW_PREFIX"/bin/*.dll
            do
                name=$(basename "$dll")
                if grep -qix "$name" <<< "$imports"
                then
                    echo "Unexpected dependency on toolchain DLL: $name" >&2
                    exit 1
                fi
            done

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
            cd release/work/build-winarm64
            mkdir dist-tar
            cd dist-tar
            tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-winarm64-intermediate
          path: release/work/build-winarm64/dist-tar/

  build-macos-aarch64:
    runs-on: macos-latest
    steps:
      - name: Check architecture
        run: |
            arch=$(uname -m)
            if [[ "$arch" != arm64 ]]
            then
                echo "Unexpected architecture: $arch" >&2
                exit 1
            fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
            brew install meson nasm libiconv zlib automake autoconf libtool

      - name: Build
        env:
          # the default Xcode (and macOS SDK) version can be found at
          # <https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md#xcode>
          #
          # then the minimal supported deployment target of that macOS SDK can be found at
          # <https://developer.apple.com/support/xcode/#minimum-requirements>
          MACOSX_DEPLOYMENT_TARGET: 10.13
        run: release/build_macos.sh aarch64

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
            cd release/work/build-macos-aarch64
            mkdir dist-tar
            cd dist-tar
            tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-aarch64-intermediate
          path: release/work/build-macos-aarch64/dist-tar/

  build-macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - name: Check architecture
        run: |
            arch=$(uname -m)
            if [[ "$arch" != x86_64 ]]
            then
                echo "Unexpected architecture: $arch" >&2
                exit 1
            fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install meson nasm libiconv zlib automake
             # autoconf and libtool are already installed on macos-13

      - name: Build
        env:
          # the default Xcode (and macOS SDK) version can be found at
          # <https://github.com/actions/runner-images/blob/main/images/macos/macos-13-Readme.md#xcode>
          #
          # then the minimal supported deployment target of that macOS SDK can be found at
          # <https://developer.apple.com/support/xcode/#minimum-requirements>
          MACOSX_DEPLOYMENT_TARGET: 10.13
        run: release/build_macos.sh x86_64

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
            cd release/work/build-macos-x86_64
            mkdir dist-tar
            cd dist-tar
            tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-x86_64-intermediate
          path: release/work/build-macos-x86_64/dist-tar/

  package-win32:
    needs:
      - build-vndroid-server
      - build-win32
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download vndroid-server
        uses: actions/download-artifact@v8
        with:
          name: vndroid-server
          path: release/work/build-server/server/

      - name: Download build-win32
        uses: actions/download-artifact@v8
        with:
          name: build-win32-intermediate
          path: release/work/build-win32/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
            cd release/work/build-win32
            tar xf dist-tar/dist.tar.gz

      - name: Package
        run: release/package_client.sh win32 zip

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: release-win32
          path: release/output/

  package-win64:
    needs:
      - build-vndroid-server
      - build-win64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download vndroid-server
        uses: actions/download-artifact@v8
        with:
          name: vndroid-server
          path: release/work/build-server/server/

      - name: Download build-win64
        uses: actions/download-artifact@v8
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
            cd release/work/build-win64
            tar xf dist-tar/dist.tar.gz

      - name: Package
        run: release/package_client.sh win64 zip

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: release-win64
          path: release/output

  package-winarm64:
    needs:
      - build-vndroid-server
      - build-winarm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download vndroid-server
        uses: actions/download-artifact@v8
        with:
          name: vndroid-server
          path: release/work/build-server/server/

      - name: Download build-winarm64
        uses: actions/download-artifact@v8
        with:
          name: build-winarm64-intermediate
          path: release/work/build-winarm64/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
            cd release/work/build-winarm64
            tar xf dist-tar/dist.tar.gz

      - name: Package
        run: release/package_client.sh winarm64 zip

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: release-winarm64
          path: release/output

  package-macos-aarch64:
    needs:
      - build-vndroid-server
      - build-macos-aarch64
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download vndroid-server
        uses: actions/download-artifact@v8
        with:
          name: vndroid-server
          path: release/work/build-server/server/

      - name: Download build-macos-aarch64
        uses: actions/download-artifact@v8
        with:
          name: build-macos-aarch64-intermediate
          path: release/work/build-macos-aarch64/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
            cd release/work/build-macos-aarch64
            tar xf dist-tar/dist.tar.gz

      - name: Package
        run: release/package_macos.sh aarch64

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-aarch64
          path: release/output/

  package-macos-x86_64:
    needs:
      - build-vndroid-server
      - build-macos-x86_64
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download vndroid-server
        uses: actions/download-artifact@v8
        with:
          name: vndroid-server
          path: release/work/build-server/server/

      - name: Download build-macos
        uses: actions/download-artifact@v8
        with:
          name: build-macos-x86_64-intermediate
          path: release/work/build-macos-x86_64/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
            cd release/work/build-macos-x86_64
            tar xf dist-tar/dist.tar.gz

      - name: Package
        run: release/package_macos.sh x86_64

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-x86_64
          path: release/output/

  release:
    needs:
      - build-vndroid-server
      - package-win32
      - package-win64
      - package-winarm64
      - package-macos-aarch64
      - package-macos-x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download vndroid-server
        uses: actions/download-artifact@v8
        with:
          name: vndroid-server
          path: release/work/build-server/server/

      - name: Download release-win32
        uses: actions/download-artifact@v8
        with:
          name: release-win32
          path: release/output/

      - name: Download release-win64
        uses: actions/download-artifact@v8
        with:
          name: release-win64
          path: release/output/

      - name: Download release-winarm64
        uses: actions/download-artifact@v8
        with:
          name: release-winarm64
          path: release/output/

      - name: Download release-macos-aarch64
        uses: actions/download-artifact@v8
        with:
          name: release-macos-aarch64
          path: release/output/

      - name: Download release-macos-x86_64
        uses: actions/download-artifact@v8
        with:
          name: release-macos-x86_64
          path: release/output/

      - name: Package server
        run: release/package_server.sh

      - name: Generate checksums
        run: release/generate_checksums.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: vndroid-release-${{ env.VERSION }}
          path: release/output
